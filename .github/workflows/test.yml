name: Test

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COVERAGE_FILE: ${{ github.workspace }}\coverage.xml

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "EP Finder Test/EP Finder Test.csproj"

      - name: Build
        run: dotnet build "EP Finder Test/EP Finder Test.csproj" --no-restore --configuration Release

      - name: Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage

      - name: Test
        run: dotnet test --project "EP Finder Test/EP Finder Test.csproj" --no-build --configuration Release --coverage --coverage-output ${{ env.COVERAGE_FILE }} --coverage-output-format cobertura

      - name: Check coverage threshold
        shell: pwsh
        run: Invoke-Expression (Get-Content .\.github\scripts\check-coverage.ps -Raw)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.COVERAGE_FILE }}
          flags: dotnet
          use_oidc: true
          fail_ci_if_error: false

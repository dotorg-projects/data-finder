name: Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "EP Finder/EP Finder.csproj"

      - name: Build
        run: dotnet build "EP Finder/EP Finder.csproj" --no-restore --configuration Release

      - name: Validate tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $props = [xml](Get-Content Directory.Build.props)
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match package version 'v$version'."
          }

      - name: Publish
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem "EP Finder/bin/Release/*.nupkg" | Select-Object -First 1
          dotnet nuget push $nupkg.FullName --api-key ${{ secrets.NUGET_ORG_EP_KEY }} --source ${{ vars.NUGET_API }}
